<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />

  <title>Snake | Juan Puelpan - Software Developer</title>
  <style>
    body,
    html {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Helvetica';
    }

    header {
      padding: 1em 0 2em 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
    }

    header h1 {
      text-align: center;
      font-size: 2rem;
      font-weight: 100;
      line-height: 1em;
      margin: 0;
      margin-bottom: 1rem;
    }

    header div {
      display: block;
      text-align: center;
    }

    header a {
      color: #ffffff;
      font-size: 1rem;
    }

    main {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    canvas {
      border: 0px none;
      background-color: black;
      padding-right: 0;
      margin-left: auto;
      margin-right: auto;
      display: block;
      width: 100%;
    }

    @media screen and (min-width: 600px) {
      canvas {
        width: auto;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Snake</h1>
    <div>
      <a href="https://github.com/Jpuelpan/snake-c">code</a>
      <span>|</span>
      <a href="https://puelpan.com">puelpan.com</a>
    </div>
  </header>

  <main>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
  </main>
  <script async type="text/javascript" src="snake.js"></script>

</html>
